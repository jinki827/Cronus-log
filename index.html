<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【謎解き＋探索】クロノス-ログ - ホーム</title>
    <link rel="stylesheet" href="https://unpkg.com/destyle.css@4.0.1/destyle.min.css">
    <link rel="stylesheet" href="./common/common.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./common/storage.js" defer></script>
    <script src="./common/script.js" defer></script>
</head>

<body>
    <main>

        <!-- 開始画面 -->
        <div id="start-screen" class="start screen hidden">
            <img src="./images/logo.svg" alt="クロノス-ログ" class="login-logo">
            <button type="button"><img src="./images/Start-button.svg" alt="スタート" class="startBtn" id="startBtn"></button>
        </div>

        <!-- ログイン画面 -->
        <div id="login-screen" class="card screen hidden">
            <img src="./images/SingUp.svg" alt="サインアップ" class="signupBtn" id="signupBtn">
            <input type="text" id="username-input" class="username-input">
            <button onclick="login()" class="loginBtn" id="loginBtn"><img src="./images/login-button.svg" alt="ログイン"></button>
        </div>

        <!-- 説明画面 -->
        <div id="explanate-screen" class="explanate screen hidden">
            <img src="./images/intro-text.svg" class="intro" alt="イントロ">
            <button type="button" onclick="showScreen('top-screen')" class="startGameBtn"><img src="./images/Start-game-button.svg" alt=""></button>
        </div>

        <!-- Top画面 -->
        <div id="top-screen" class="top screen hidden">
            <button class="reset-btn" onclick="resetGame()">最初からやり直す。</button>
            <div class="title"><a href="./index.html"><img src="./images/logo.svg" alt="クロノス-ログ"></a></div>

            <div class="footer">
                <ul class="footer-menu">
                    <li><button type="button" class="home-btn"><img src="./images/HOME.svg" alt="ホーム"></button></li>
                    <li><a href="./floor4/floor4.html"><img src="./images/floor4.svg" alt="4層"></a></li>
                    <li><a href="./floor5/floor5.html"><img src="./images/floor5.svg" alt="5層"></a></li>
                    <li><a href="./floor6/floor6.html"><img src="./images/floor6.svg" alt="6層"></a></li>
                    <li><button type="button" id="start-btn" class="qrBtn"><img src="./images/QR.svg" alt="QRコード"></button></li>
                </ul>
            </div>
        </div><!-- /#top-screen -->

    </main>
</body>

</html>
