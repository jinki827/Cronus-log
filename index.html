<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【謎解き＋探索】クロノス-ログ - ホーム</title>
  <link rel="stylesheet" href="https://unpkg.com/destyle.css@4.0.1/destyle.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p&family=Noto+Serif+JP:wght@200..900&family=Shippori+Mincho&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./common/common.css">
  <link rel="stylesheet" href="./index/index.css">

  <script src="./common/storage.js" defer></script>
  <script src="./index/script.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript" defer></script>
</head>

<body>
  <main>

    <!-- 開始画面 -->
    <section id="start-screen" class="start screen hidden">
      <div class="title">
        <h1 class="logo">クロノス-ログ</h1>
        <p class="logo-sub">Chronos-log</p>
      </div>
      <button type="button" id="startBtn">Start</button>
    </section>

    <!-- ログイン画面 -->
    <section id="login-screen" class="card screen hidden">
      <div class="cord-content">
        <h1>Sing Up</h1>
        <p>名前を教えてください。<br>※ニックネーム</p>
        <input type="text" id="username-input" class="username-input">
      </div>
      <button onclick="login()" class="loginBtn" id="loginBtn">log in</button>
    </section>

    <!-- 説明画面 -->
    <section id="explanate-screen" class="explanate screen">
      <img src="./index/images/intro-text.svg" class="intro" alt="イントロ">
      <button type="button" onclick="showScreen('top-screen')" class="startGameBtn"><img
          src="./index/images/Start-game-button.svg" alt=""></button>
    </section>

    <!-- Top画面 -->
    <section id="top-screen" class="top screen hidden">
      <!-- top-header -->
      <div class="top-header">
        <div class="title">
          <a href="./index.html">
            <h1 class="logo">クロノス-ログ</h1>
            <p class="logo-sub">Chronos-log</p>
          </a>
        </div>
      </div>

      <!-- top-main -->
      <div class="top-main">
        <!-- floor select -->
        <div class="floor">
  
          <!-- floor6 -->
          <div class="jump-floor floor6">
            <h2>6階:未来</h2>
            <a href="./floor6/floor6.html">
              探索する →
            </a>
            <div class="quiz-release">
              <img src="./index/images/quiz-release.svg" alt="">
              <img src="./index/images/quiz-release.svg" alt="">
              <img src="./index/images/quiz-release.svg" alt="">
            </div>
          </div>
  
          <!-- floor5 -->
          <div class="jump-floor floor5">
            <h2>5階:現世</h2>
            <a href="./floor6/floor5.html">
              探索する →
            </a>
            <div class="quiz-release">
              <img src="./index/images/quiz-release.svg" alt="">
              <img src="./index/images/quiz-release.svg" alt="">
              <img src="./index/images/quiz-release.svg" alt="">
            </div>
          </div>
  
          <!-- floor4 -->
          <div class="jump-floor floor4">
            <h2>4階:過去</h2>
            <a href="./floor6/floor4.html">
              探索する →
            </a>
            <div class="quiz-release">
              <img src="./index/images/quiz-release.svg" alt="">
              <img src="./index/images/quiz-release.svg" alt="">
              <img src="./index/images/quiz-release.svg" alt="">
            </div>
          </div>
        </div>
        <button class="reset-btn" onclick="resetGame()">最初からやり直す。</button>
      </div>

      <!-- top-footer -->
      <div class="top-footer">
        <ul class="footer-menu">
          <li><a href="./index.html" class="home-btn"><img src="/index/images/home-icon.svg" alt="ホーム"><p>ホーム</p></a></li>
          <li><a href="./floor4/floor4.html" class="floor4-btn"><img src="./index/images/floor-icon.svg" alt="4層"><p>4階</p></a></li>
          <li><a href="./floor5/floor5.html" class="floor5-btn"><img src="./index/images/floor-icon.svg" alt="5層"><p>5階</p></a></li>
          <li><a href="./floor6/floor6.html" class="floor6-btn"><img src="./index/images/floor-icon.svg" alt="6層"><p>6階</p></a></li>
          <li><button type="button" id="start-btn" class="qrBtn"><img src="./index/images/qr-icon.svg" alt="QRコード"><p>QR</p></button></li>
        </ul>
      </div>
      <div id="scanner-container">
        <div id="reader" width="600px"></div>
        <button type="button" id="closeQrcodeButton" class="stop-btn">閉じる</button>
      </div>
    </section><!-- /#top-screen -->

  </main>
</body>

</html>
