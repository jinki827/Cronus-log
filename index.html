<!DOCTYPE html>
<html lang="ja">
  
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【謎解き＋探索】クロノス-ログ - ホーム</title>
    <link rel="stylesheet" href="https://unpkg.com/destyle.css@4.0.1/destyle.min.css">
    <link rel="stylesheet" href="./common/common.css">
    
    <script src="./common/storage.js" defer></script>
    <script src="./index/script.js" defer></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript" defer></script>
</head>

<body>
    <h1>【謎解き＋探索】クロノス-ログ</h1>

    <!-- ログイン画面 -->
    <div id="login-screen" class="card hidden">
        <h2>ようこそ！</h2>
        <p>プレイヤー名を入力してください。</p>
        <input type="text" id="username-input" placeholder="名前">
        <br>
        <button onclick="login()">ゲームを始める</button>
    </div>

    <!-- Top画面 -->
    <div id="top-screen" class="card hidden">
        <h2>いざ！探索(^^♪</h2>
        <p><span id="player-name"></span>さん </p>
        <div class="quiz-menu">
            <ul class="quiz-menu-mirai">
                <a href="./floor6/floor6.html">第六層：未来</a>
            </ul>
            <ul class="quiz-menu-mirai">
                <a href="./floor5/floor5.html">第五層：現世</a>
            </ul>
            <div class="footer">
                <ul class="footer-menu">
                    <li><button type="button" class="home-btn"><img src="./index/images/HOME.svg" alt="ホーム" class="home-img"></button></li>
                    <li><a href="./floor4/floor4.html"><img src="./index/images/floor4.svg" alt="4層" class="floor4-img"></a></li>
                    <li><a href="./floor5/floor5.html"><img src="./index/images/floor5.svg" alt="5層" class="floor5-img"></a></li>
                    <li><a href="./floor6/floor6.html"><img src="./index/images/floor6.svg" alt="6層" class="floor6-img"></a></li>
                    <li><button type="button" id="start-btn" class="qrBtn"><img src="./index/images/QR.svg" alt="QRコード"></button></li>
                </ul>
            </div>
            <div id="scanner-container">
              <div id="reader" width="600px"></div>
              <button type="button" id="closeQrcodeButton" class="stop-btn">閉じる</button>
            </div>
        </div><!-- /#top-screen -->

</body>
</html>
