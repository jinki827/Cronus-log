<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【謎解き＋探索】クロノス-ログ - 問題1</title>
    <style>
        /* 画面を隠すためのクラス */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h2>問題1</h2>
    <p>次のような分類されるとき、「フットサル」はどっちにはいるでしょうか？</p>

    <dl>
        <dt>あり</dt>
        <dd>エンドウ豆</dd>
        <dd>アトランタ</dd>
        <dd>悪魔</dd>
        
        <dt>なし</dt>
        <dd>大豆</dd>
        <dd>ニューヨーク</dd>
        <dd>天使</dd>
    </dl>

    <h4>回答</h4>
    <select name="q1-ans-input" id="q1-ans-input">
        <option value="">--1つ選択してください--</option>
        <option value="yes">あり</option>
        <option value="no">なし</option>
    </select>
    <button onclick="submitAnswer()">回答する</button>

    <p id="result-message" style="color: red;"></p>


    <div id="incorrect-screen" class="incorrect hidden">
        <h4>不正解</h4>
        <p>ああ、残念だよ。</p>
    </div>
    <div id="correct-screen" class="correct hidden">
        <h4>正解</h4>
        <p>
            「あり」<br>
            エンドウ豆（ゾウ）、アトランタ（トラ）、悪魔（クマ）<br>
            「フットサル」には「猿」が含まれていますね。
        </p>
    </div>

    <button onclick="window.location.href='../index.html'">TOPに戻る</button>
    
    <!-- 
    <div class="hint">
        <h4>ヒント</h4>
        <p>
            ありの分類には、<br>
            共通してとあるものの名前が含まれています。
        </p>
    </div>
-->



    <script src="../js/storage.js"></script>
    <script>
        let playerData;

        // ページを開いたとき、ログインしているかチェックする
        window.onload = function() {
            playerData = checkAuth();
        };

        // 回答するボタンを押した時の処理
        function submitAnswer() {
            // ドロップダウンの選択された値を取得
            const answer = document.getElementById("q1-ans-input").value;
            const msgEl = document.getElementById("result-message");
            // console.log(answer)

            // 一旦、正解・不正解ブロックとメッセージをリセット（隠す）
            document.getElementById("correct-screen").classList.add("hidden");
            document.getElementById("incorrect-screen").classList.add("hidden");
            msgEl.innerText = "";

            // 1. 何も選んでない場合
            if (answer === "") {
                msgEl.innerText = "選択肢を選んでください。";
                return; // ここで処理をストップ
            }

            // 2. 正解(yes)を選んだ場合
            if (answer === "yes") {
                document.getElementById("correct-screen").classList.remove("hidden");
            }

            // 3. 不正解(no)を選んだ場合
            else {
                document.getElementById("incorrect-screen").classList.remove("hidden");
            }
        }

    </script>
</body>
</html>
