<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>floor6:未来偏</title>
  <link rel="stylesheet" href="https://unpkg.com/destyle.css@4.0.1/destyle.min.css">
  <link rel="stylesheet" href="./floor6.css">
  <link rel="stylesheet" href="../common/common.css">

</head>

<body>
  <!-- header -->
  <header>
    <!-- header-title -->
    <div class="header-inner">
      <div class="header-title">
        <h1>6階：未来</h1>
        <div class="horizon-line"></div>
      </div>
      <div class="header-left-fixed">
        <svg viewBox="0 0 100 100" aria-hidden="true" preserveAspectRatio="none" class="diagonal">
          <path d="M0 100 L100 0" stroke="#D4D4D4" stroke-width="1" vector-effect="non-scaling-stroke" />
        </svg>
        <div class="header-logo">
          <p class="logo-text">クロノス-ログ</p>
          <div class="horizon-line"></div>
        </div>
      </div>
    </div>

    <!-- 問題切り替えタブ -->
    <ul class="quiz-tab">
      <li class="quiz-tab-item"><button type="button" class="tab-button is-active"
          data-target="view-home-f6">ホーム</button></li>
      <li class="quiz-tab-item"><button type="button" class="tab-button" data-target="view-q1-f6">Q1</button></li>
      <li class="quiz-tab-item"><button type="button" class="tab-button" data-target="view-q2-f6">Q2</button></li>
      <li class="quiz-tab-item"><button type="button" class="tab-button" data-target="view-q3-f6">Q3</button></li>
      <li class="quiz-tab-item"><button type="button" class="tab-button" data-target="view-boss-f6">ボス問</button></li>
    </ul>
  </header>

  <!-- main -->
  <main>

    <!-- メイン画面 -->
    <div class="view-container">
      <!-- ホーム画面 -->
      <section id="view-hone-f6" class="view-panel">
        <!-- 説明(introduction) -->
        <div class="introduction">
          <div class="introduction-card">
            <p>
              ここは、60年後の収束未来の1つです。ここでのインシデントは、クロエ(仮)の奪われた記憶を奪還することです。
            </p>
            <p>
              時空管理局 AI クロノス
            </p>
          </div>
        </div>
        <!-- hint -->
        <div class="quiz-area">
          <div class="quiz-card">
            <div class="quiz-text">
              <h2>ヒント</h2>
              <p>
                ６階のフリースペースで、QRコードを探そう。敵が潜んでいるかもしれません。
              </p>
            </div>
          </div>

        </div>
      </section>
      <!-- Q1画面 -->
      <section id="view-q1-f6" class="view-panel hidden">
        <!-- 説明(introduction) -->
        <div class="introduction"></div>
        <!-- q1問題文 -->
        <div class="quiz-area"></div>
      </section>

      <!-- Q2画面 -->
      <section id="view-q2-f6" class="view-panel hidden">
        <!-- 説明(introduction) -->
        <div class="introduction"></div>
        <!-- q2問題文 -->
        <div class="quiz-area"></div>
      </section>

      <!-- Q3画面 -->
      <section id="view-q3-f6" class="view-panel hidden">
        <!-- 説明(introduction) -->
        <div class="introduction"></div>
        <!-- q3問題文 -->
        <div class="quiz-area"></div>
      </section>

      <!-- boss画面 -->
      <section id="view-boss-f6" class="view-panel hidden">
        <!-- 説明(introduction) -->
        <div class="introduction"></div>
        <!-- boss問題文 -->
        <div class="quiz-area"></div>
      </section>
    </div>
  </main>

  <!-- footer -->
  <footer>
    <div class="footer">
      <ul class="footer-menu">
        <li><a href="../index.html" class="home-btn"><img src="../index/images/home-icon.svg" alt="ホーム"><p>ホーム</p></a></li>
        <li><a href="./floor4/floor4.html" class="floor4-btn"><img src="../index/images/floor-icon.svg" alt="4層"><p>4階</p></a></li>
        <li><a href="./floor5/floor5.html" class="floor5-btn"><img src="../index/images/floor-icon.svg" alt="5層"><p>5階</p></a></li>
        <li><a href="./floor6/floor6.html" class="floor6-btn"><img src="../index/images/floor-icon.svg" alt="6層"><p>6階</p></a></li>
        <li><button type="button" id="start-btn" class="qrBtn"><img src="../index/images/qr-icon.svg" alt="QRコード"><p>QR</p></button></li>
      </ul>
    </div>
    <div id="scanner-container">
      <div id="reader" width="600px"></div>
      <button type="button" id="closeQrcodeButton" class="stop-btn">閉じる</button>
    </div>
  </footer>
</body>

</html>
